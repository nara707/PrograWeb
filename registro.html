<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro exitoso | BOOKNET</title>
  <style>
    body {
      background-color: #fdefff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .mensaje-container {
      background-color: #fff8f8;
      border: 2px solid #a8d042;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }

    h1 {
      color: #556b2f;
      margin-bottom: 1rem;
    }

    p {
      color: #333;
      margin-bottom: 1.5rem;
    }

    a {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: #a8d042;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #8ab435;
    }
  </style>
</head>
<body>
  <div class="mensaje-container">
    <h1>¡Registro exitoso! ✅</h1>
    <p>Gracias por unirte a BOOKNET. Ya puedes realizar tus pedidos.</p>
    <a href="index.html">Volver al inicio</a>
  </div>
</body>
</html>
