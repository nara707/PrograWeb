<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BOOKNET - Perfil</title>
  <style>
    body {
      background-color: #fdefff;
      font-family: 'Fredoka', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #dc2f5e;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
    }

    header .logo {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: white;
    }

    .perfil-container {
      display: flex;
      flex-direction: row;
      padding: 1rem;
    }

    .perfil-izquierda {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: 2rem;
    }

    .perfil-izquierda .foto {
      width: 200px;
      height: 250px;
      background-color: #dc2f5e;
      border-radius: 20px;
      margin-bottom: 1rem;
      background-size: cover;
      background-position: center;
    }

    .perfil-izquierda input[type="file"] {
      margin-bottom: 1rem;
    }

    .perfil-izquierda p {
      font-weight: bold;
      color: #556b2f;
      margin: 0.3rem;
    }

    .perfil-izquierda button {
      margin-top: 0.5rem;
      background-color: #a2c83a;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 0.8rem 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .perfil-derecha {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .campo {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .campo label {
      width: 180px;
      background-color: #a2c83a;
      color: white;
      font-weight: bold;
      padding: 0.5rem;
      border-radius: 5px;
      margin-right: 1rem;
      min-width: 160px;
      text-align: center;
    }

    .campo input {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #a2c83a;
      border-radius: 5px;
      font-family: 'Fredoka', sans-serif;
    }

    .botones {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .botones button {
      background-color: #a2c83a;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      flex: 1;
      cursor: pointer;
    }

    .botones button:hover {
      background-color: #8fb732;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BOOKNET</div>
  </header>

  <div class="perfil-container">
    <div class="perfil-izquierda">
      <div class="foto" id="fotoPerfil"></div>
      <input type="file" accept="image/*" onchange="subirFoto(event)">
      <p id="nombreUsuario">user</p>
      <p id="correoUsuario">correo</p>
      <button onclick="guardarPerfil()">Editar perfil</button>
    </div>

    <div class="perfil-derecha">
      <div class="campo">
        <label>Direccion</label>
        <input id="inputDireccion" type="text" />
      </div>
      <div class="campo">
        <label>Metodo de pago</label>
        <input id="inputPago" type="text" />
      </div>
      <div class="campo">
        <label>Telefono celular</label>
        <input id="inputTelefono" type="text" />
      </div>

      <div class="botones">
        <button onclick="window.location.href='mispedidos.html'">Pedidos</button>
        <button onclick="window.location.href='carrito.html'">Carrito</button>
        <button onclick="window.location.href='historial.html'">Historial</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const perfil = JSON.parse(localStorage.getItem('perfilUsuario')) || {};

      document.getElementById('nombreUsuario').textContent = perfil.usuario || 'Usuario';
      document.getElementById('correoUsuario').textContent = perfil.correo || 'Correo';
      document.getElementById('inputDireccion').value = perfil.direccion || '';
      document.getElementById('inputPago').value = perfil.metodoPago || '';
      document.getElementById('inputTelefono').value = perfil.telefono || '';

      if (perfil.foto) {
        document.getElementById('fotoPerfil').style.backgroundImage = `url('${perfil.foto}')`;
      }
    });

    function guardarPerfil() {
      const perfilActualizado = {
        usuario: document.getElementById('nombreUsuario').textContent,
        correo: document.getElementById('correoUsuario').textContent,
        direccion: document.getElementById('inputDireccion').value,
        metodoPago: document.getElementById('inputPago').value,
        telefono: document.getElementById('inputTelefono').value,
        foto: document.getElementById('fotoPerfil').style.backgroundImage.replace('url("', '').replace('")', '')
      };

      localStorage.setItem('perfilUsuario', JSON.stringify(perfilActualizado));
      alert('Perfil actualizado con éxito');
    }

    function subirFoto(event) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imagenBase64 = e.target.result;
        document.getElementById('fotoPerfil').style.backgroundImage = `url('${imagenBase64}')`;
      };
      reader.readAsDataURL(event.target.files[0]);
    }
  </script>
</body>
</html>
