<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKNET - Página principal</title>
  <style>
    body {
      background-color: #fdefff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      color: #556b2f;
    }

    #carrito-contenido {
      background-color: #fff8f8;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem;
      max-width: 600px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    #carrito-contenido h2 {
      color: #dc2f5e;
      margin-top: 0;
    }

    #lista-carrito li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
      color: #333;
    }

    #vaciar-carrito, #finalizar-compra, #ver-historial, #volver-inicio {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #dc2f5e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 1rem;
    }

    #vaciar-carrito:hover, #finalizar-compra:hover, #ver-historial:hover, #volver-inicio:hover {
      background-color: #c22e50;
    }

    #saludo-usuario {
      font-weight: bold;
      color: #556b2f;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div id="saludo-usuario"></div>
  <h1>Bienvenido a BOOKNET </h1>
  <p>Descubre nuestros libros favoritos y agrégalos a tu carrito.</p>

  <div id="carrito-contenido">
    <h2>🛒 Carrito de compras</h2>
    <ul id="lista-carrito"></ul>
    <button id="vaciar-carrito" onclick="vaciarCarrito()">Vaciar carrito</button>
    <button id="finalizar-compra" onclick="finalizarCompra()">Finalizar compra</button>
    <button id="ver-historial" onclick="window.location.href='hisotrialdepedidos.html'">Ver historial</button>
    <button id="volver-inicio" onclick="window.location.href='index.html'">Volver al inicio</button>
  </div>

  <script>
    function mostrarCarrito() {
      const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      const lista = document.getElementById("lista-carrito");
      lista.innerHTML = "";

      if (carrito.length === 0) {
        const vacio = document.createElement("li");
        vacio.textContent = "El carrito está vacío.";
        lista.appendChild(vacio);
        return;
      }

      carrito.forEach((producto) => {
        const item = document.createElement("li");
        item.textContent = `${producto.nombre} - $${producto.precio.toFixed(2)} MXN`;
        lista.appendChild(item);
      });
    }

    function vaciarCarrito() {
      localStorage.removeItem("carrito");
      mostrarCarrito();
    }

    function finalizarCompra() {
      const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      if (carrito.length === 0) {
        alert("Tu carrito está vacío.");
        return;
      }

      let historial = JSON.parse(localStorage.getItem("historialPedidos")) || [];
      historial.push(carrito);
      localStorage.setItem("historialPedidos", JSON.stringify(historial));

      alert("¡Compra finalizada! Gracias por tu pedido.");
      localStorage.removeItem("carrito");
      mostrarCarrito();
    }

    function mostrarSaludoUsuario() {
      const usuario = JSON.parse(localStorage.getItem("usuarioRegistrado"));
      if (usuario && usuario.nombre) {
        const saludo = document.getElementById("saludo-usuario");
        saludo.textContent = `Hola, ${usuario.nombre}! 👋`;
      }
    }

    window.onload = function () {
      mostrarSaludoUsuario();
      mostrarCarrito();
    };
  </script>
</body>
</html>
